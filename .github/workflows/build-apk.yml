name: Build Avalia Mary APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
      - name: Build APK
        run: ./gradle-8.9/bin/gradle assembleDebug --no-daemon
      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Avalia-Mary.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Avalia-Mary-APK
          path: Avalia-Mary.apk
      - name: Publish latest APK in repository
        run: |
          git config user.name 'Avalia Mary Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f Avalia-Mary.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: update Avalia Mary APK [skip ci]'
          git push
